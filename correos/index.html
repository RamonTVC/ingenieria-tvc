<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de correos ZKTeco</title>

<style>
  body {
    font-family: Arial, sans-serif;
    margin: 30px;
    background: #f4f4f9;
  }

  h2 {
    color: #333;
  }

  .container {
    background: #fff;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    max-width: 600px;
    margin: auto;
  }

  label {
    display: block;
    margin-top: 12px;
    font-weight: bold;
  }

  select,
  input,
  textarea {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;
  }

  input:disabled {
    background-color: #eeeeee;
    color: #555;
    cursor: not-allowed;
  }

  button {
    margin-top: 15px;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #007bff;
    color: white;
    font-weight: bold;
  }

  button:hover {
    background: #0056b3;
  }

  .secondary-button {
    background: #6c757d;
    margin-left: 8px;
  }

  .secondary-button:hover {
    background: #545b62;
  }

  .file-container {
    margin-top: 5px;
    padding: 12px;
    background: #f8f8f8;
    border: 1px solid #ddd;
    border-radius: 8px;
  }

  .file-container input {
    border: none;
    padding: 5px 0;
    background: transparent;
  }

  .status {
    margin-top: 8px;
    font-size: 13px;
  }

  .status.success {
    color: #198754;
  }

  .status.warning {
    color: #d97706;
  }

  .id-container {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .id-container input {
    flex: 1;
  }

  .id-container button {
    margin-top: 5px;
    white-space: nowrap;
  }

  .output {
    margin-top: 20px;
    background: #f9f9f9;
    padding: 15px;
    border-radius: 8px;
    border: 1px solid #ddd;
  }

  .copy-buttons {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }

  pre {
    white-space: pre-line;
    font-family: inherit;
  }
</style>
</head>

<body>

<div class="container">

  <h2>Generador de correos ZKTeco</h2>

  <!-- TIPO DE CORREO -->
  <label for="tipoCorreo">Tipo de correo:</label>

  <select id="tipoCorreo">
    <option value="reset">Reset de Licencia</option>
    <!-- Aquí agregaremos posteriormente otros procedimientos -->
  </select>


  <!-- SOFTWARE -->
  <label for="software">Software:</label>

  <select id="software">
    <option>ZKBio CVAccess</option>
    <option>ZKBio CVSecurity</option>
    <option>ZKBioSecurity</option>
    <option>ZKTime Net 3.0</option>
    <option>BioTime Pro</option>
  </select>


  <!-- SUCURSAL -->
  <label for="sucursal">Sucursal:</label>

  <select id="sucursal">
    <option>MTY</option>
    <option>SNC</option>
    <option>AZC</option>
    <option>IZT</option>
    <option>GDL</option>
    <option>ZAP</option>
    <option>CUN</option>
    <option>CHI</option>
    <option>CUL</option>
    <option>HMO</option>
    <option>BJX</option>
    <option>MID</option>
    <option>PUE</option>
    <option>QRO</option>
    <option>SLP</option>
    <option>TIJ</option>
    <option>TOL</option>
    <option>TOR</option>
    <option>VER</option>
    <option>VSA</option>
  </select>


  <!-- ARCHIVO XML -->
  <label for="archivoXML">Archivo de licencia:</label>

  <div class="file-container">

    <input
      type="file"
      id="archivoXML"
      accept=".xml"
      onchange="leerXML()"
    >

    <div id="estadoXML" class="status">
      Ningún archivo seleccionado.
    </div>

  </div>


  <!-- ID DE LICENCIA -->
  <label for="licenciaID">ID de licencia:</label>

  <div class="id-container">

    <input
      type="text"
      id="licenciaID"
      placeholder="Ej. 123456"
      disabled
      oninput="validarNumeros(this)"
    >

    <button
      type="button"
      class="secondary-button"
      id="editarID"
      onclick="editarID()"
    >
      Editar ID
    </button>

  </div>


  <!-- MOTIVO -->
  <label for="motivo">Motivo (opcional):</label>

  <textarea
    id="motivo"
    rows="3"
    placeholder="Ej. el disco duro del cliente se dañó..."
  ></textarea>


  <!-- GENERAR -->
  <button onclick="generarCorreo()">
    Generar correo
  </button>


  <!-- RESULTADO -->
  <div
    class="output"
    id="resultado"
    style="display:none;"
  >

    <h3>Resultado:</h3>

    <p>
      <strong>Asunto:</strong>
    </p>

    <pre id="asuntoTexto"></pre>

    <p>
      <strong>Cuerpo:</strong>
    </p>

    <pre id="cuerpoTexto"></pre>

    <div class="copy-buttons">

      <button onclick="copiarAsunto()">
        Copiar Asunto
      </button>

      <button onclick="copiarCuerpo()">
        Copiar Cuerpo
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================================
   VALIDAR QUE EL ID SOLAMENTE CONTENGA NÚMEROS
   ========================================================= */

function validarNumeros(input) {

  input.value = input.value.replace(/[^0-9]/g, '');

}


/* =========================================================
   LEER ARCHIVO XML
   ========================================================= */

function leerXML() {

  const archivo =
    document.getElementById("archivoXML").files[0];

  const campoID =
    document.getElementById("licenciaID");

  const estado =
    document.getElementById("estadoXML");

  const botonEditar =
    document.getElementById("editarID");


  // Si no se seleccionó ningún archivo

  if (!archivo) {

    campoID.value = "";

    campoID.disabled = true;

    estado.textContent =
      "Ningún archivo seleccionado.";

    estado.className = "status";

    botonEditar.textContent = "Editar ID";

    return;

  }


  const lector = new FileReader();


  lector.onload = function(event) {

    const contenidoXML = event.target.result;


    try {

      // Analizar el XML

      const parser = new DOMParser();

      const xml = parser.parseFromString(
        contenidoXML,
        "text/xml"
      );


      // Verificar si el XML tiene errores

      const errorXML =
        xml.getElementsByTagName("parsererror");


      if (errorXML.length > 0) {

        throw new Error("XML inválido");

      }


      /*
       * Buscamos específicamente:
       *
       * <xmlInfo>
       *     <id>123456</id>
       * </xmlInfo>
       *
       * Esto evita confundirlo con los <id>
       * que existen dentro de <module>.
       */

      const xmlInfo =
        xml.getElementsByTagName("xmlInfo")[0];


      if (!xmlInfo) {

        throw new Error(
          "No se encontró xmlInfo"
        );

      }


      const id =
        xmlInfo.getElementsByTagName("id")[0];


      if (!id) {

        throw new Error(
          "No se encontró el ID"
        );

      }


      // Obtener el contenido del ID

      const idLicencia =
        id.textContent.trim();


      // Verificar que realmente sea numérico

      if (!/^[0-9]+$/.test(idLicencia)) {

        throw new Error(
          "El ID encontrado no es numérico"
        );

      }


      // Colocar ID

      campoID.value = idLicencia;


      // Bloquear campo

      campoID.disabled = true;


      // Cambiar estado

      estado.textContent =
        "✓ ID detectado automáticamente";

      estado.className =
        "status success";


      botonEditar.textContent =
        "Editar ID";


    }

    catch (error) {

      /*
       * Si algo falla, permitimos que el usuario
       * capture el ID manualmente.
       */

      campoID.value = "";

      campoID.disabled = false;

      campoID.focus();


      estado.textContent =
        "⚠ No se pudo detectar el ID. Ingrésalo manualmente.";

      estado.className =
        "status warning";


      botonEditar.textContent =
        "Bloquear ID";

    }

  };


  lector.onerror = function() {

    campoID.value = "";

    campoID.disabled = false;

    estado.textContent =
      "⚠ No se pudo leer el archivo. Ingresa el ID manualmente.";

    estado.className =
      "status warning";

    botonEditar.textContent =
      "Bloquear ID";

  };


  // Leer el archivo como texto

  lector.readAsText(archivo);

}


/* =========================================================
   EDITAR / BLOQUEAR ID
   ========================================================= */

function editarID() {

  const campoID =
    document.getElementById("licenciaID");

  const boton =
    document.getElementById("editarID");

  const estado =
    document.getElementById("estadoXML");


  if (campoID.disabled) {

    // Desbloquear

    campoID.disabled = false;

    campoID.focus();

    boton.textContent =
      "Bloquear ID";

    estado.textContent =
      "✎ ID editable manualmente";

    estado.className =
      "status warning";

  }

  else {

    // Bloquear

    if (!campoID.value.trim()) {

      alert(
        "Ingresa un ID antes de bloquear el campo."
      );

      campoID.focus();

      return;

    }


    campoID.disabled = true;

    boton.textContent =
      "Editar ID";

    estado.textContent =
      "✓ ID establecido manualmente";

    estado.className =
      "status success";

  }

}


/* =========================================================
   GENERAR CORREO
   ========================================================= */

function generarCorreo() {

  const tipo =
    document.getElementById("tipoCorreo").value;

  const software =
    document.getElementById("software").value;

  const sucursal =
    document.getElementById("sucursal").value;

  const id =
    document.getElementById("licenciaID").value.trim();

  const motivo =
    document.getElementById("motivo").value.trim();


  // Validación

  if (!software || !sucursal || !id) {

    alert(
      "Por favor llena los campos obligatorios (software, sucursal e ID)."
    );

    return;

  }


  /*
   * Por ahora solamente tenemos
   * Reset de Licencia.
   *
   * Posteriormente aquí agregaremos:
   *
   * Unificación
   * Cambio de servidor
   * Etc.
   */

  const asunto =
    `Reset de Licencia - ${software} (${sucursal}) ${id}`;


  let cuerpo =
    `Buen dia\n\nPor medio de este correo les solicitamos aplicar reset a la licencia adjunta para el software ${software}.`;


  if (motivo) {

    cuerpo =
      `Buen dia\n\nPor medio de este correo les solicitamos aplicar reset a la licencia adjunta para el software ${software}, ${motivo}.\n\nSin más por el momento, quedamos al pendiente.\nUn saludo.`;

  }

  else {

    cuerpo +=
      `\n\nSin más por el momento, quedamos al pendiente.\nUn saludo.`;

  }


  // Mostrar resultado

  document.getElementById("resultado").style.display =
    "block";

  document.getElementById("asuntoTexto").textContent =
    asunto;

  document.getElementById("cuerpoTexto").textContent =
    cuerpo;


  // Guardar temporalmente

  window.asuntoGlobal =
    asunto;

  window.cuerpoGlobal =
    cuerpo;

}


/* =========================================================
   COPIAR ASUNTO
   ========================================================= */

function copiarAsunto() {

  navigator.clipboard.writeText(
    window.asuntoGlobal
  );

  alert(
    "Asunto copiado al portapapeles."
  );

}


/* =========================================================
   COPIAR CUERPO
   ========================================================= */

function copiarCuerpo() {

  navigator.clipboard.writeText(
    window.cuerpoGlobal
  );

  alert(
    "Cuerpo copiado al portapapeles."
  );

}

</script>

</body>
</html>
